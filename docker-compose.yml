services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://lab:lab@db:5432/lab
    command: sh -c "alembic upgrade head && python seed.py --if-empty"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://lab:lab@db:5432/lab
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEV_MODE: ${DEV_MODE:-false}
      DEV_MODE_ALLOWED_IPS: ${DEV_MODE_ALLOWED_IPS:-}
      DEV_MODE_ALLOWED_EMAILS: ${DEV_MODE_ALLOWED_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ADMIN_EMAILS: ${GOOGLE_ADMIN_EMAILS:-admin@lab.test}
      BOT_TOKEN: ${BOT_TOKEN:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-internal-secret}
      TELEGRAM_BOT_WEBHOOK_URL: ${TELEGRAM_BOT_WEBHOOK_URL:-http://telegram-bot:8080/bot/webhook}
      PWA_PUBLIC_URL: ${PWA_PUBLIC_URL:-https://lab.example.ru}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@lab.test}
    expose:
      - "8000"
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000

  code-generator:
    build: ./code-generator
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-internal-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      PRINTER_MODEL: ${PRINTER_MODEL:-QL-800}
      PRINTER_ADDRESS: ${PRINTER_ADDRESS:-}
      LABEL_SIZE: ${LABEL_SIZE:-62x100}
      PRINTER_DRY_RUN: ${PRINTER_DRY_RUN:-false}
    expose:
      - "8001"

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - backups:/backups

  pwa:
    build:
      context: ./pwa
      args:
        VITE_API_URL: /api/v1
        VITE_CODE_GENERATOR_URL: /codegen
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_DEV_MODE: ${DEV_MODE:-false}
        LAN_IP: ${SERVER_LAN_IP:-127.0.0.1}
    restart: unless-stopped
    depends_on:
      - backend
      - code-generator
    ports:
      - "5173:80"
      - "443:443"

  telegram-bot:
    build: ./telegram-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BACKEND_URL: http://backend:8000/api/v1
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-internal-secret}
      PWA_PUBLIC_URL: ${PWA_PUBLIC_URL:-https://lab.example.ru}
      WEBHOOK_PORT: 8080
    expose:
      - "8080"

volumes:
  db_data:
  backups: