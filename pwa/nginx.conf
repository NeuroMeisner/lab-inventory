# Общий контур ограничения частоты запросов к API (защита от явных атак)
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=link:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Закрываем документацию бэкенда и генератора (недоступна снаружи)
    location = /api/docs            { return 403; }
    location = /api/redoc           { return 403; }
    location = /api/openapi.json    { return 403; }
    location ^~ /api/docs/          { return 403; }
    location ^~ /api/redoc/         { return 403; }
    location = /codegen/docs        { return 403; }
    location = /codegen/redoc       { return 403; }
    location = /codegen/openapi.json { return 403; }

    # Строгие лимиты на чувствительные эндпоинты
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/users/link-telegram {
        limit_req zone=link burst=5 nodelay;
        proxy_pass http://backend:8000/api/v1/users/link-telegram;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси к бэкенду: лимит частоты + проброс реального IP клиента
    location /api/ {
        limit_req zone=api burst=25 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси к генератору кодов: проброс реального IP клиента
    location /codegen/ {
        proxy_pass http://code-generator:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}