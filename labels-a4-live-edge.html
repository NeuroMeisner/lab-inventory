<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Label test sheet — live codes (A4)</title>
<style>
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: Arial, Helvetica, sans-serif; color: #000; }

  .sheet { display: flex; flex-wrap: wrap; gap: 8mm; align-items: flex-start; }
  .label {
    width: 62mm;
    padding: 1.5mm;
    border: 0.2mm solid #d0d0d0;   /* едва заметная граница по размеру этикетки */
  }
  .label-caption { font-size: 3mm; color: #666; margin-bottom: 1mm; }

  .content { width: 59mm; display: flex; flex-direction: column; align-items: center; }

  .qr, .dm { display: block; }
  .qr { width: 55mm; height: 55mm; }
  .dm { width: 36mm; height: 36mm; }

  .qr-caption {
    margin-top: 2mm; font-size: 5.2mm; font-weight: 700;
    letter-spacing: 0.2mm; text-align: center; line-height: 1.1; word-break: break-all;
  }

  .info { width: 100%; margin-top: 2.5mm; text-align: center; line-height: 1.3; }
  .name { font-size: 4.8mm; font-weight: 700; overflow-wrap: anywhere; }
  .line { font-size: 3.5mm; }
  .sep { color: #444; }

  .id-small {
    margin-top: 2mm;
    font-family: "Courier New", monospace;
    font-size: 2.8mm;
    color: #333;
    text-align: center;
    letter-spacing: 0.05mm;
  }
</style>
</head>
<body>
  <div class="sheet">

    <!-- Этикетка 1: QR адреса -->
    <div>
      <div class="label-caption">Location label (62×72 mm)</div>
      <div class="label">
        <div class="content">
          <img
            class="qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=650x650&margin=4&data=LOC%3AS-R01-03"
            alt="QR S-R01-03"
          />
          <div class="qr-caption">S-R01-03</div>
        </div>
      </div>
    </div>

    <!-- Этикетка 2: DataMatrix упаковки -->
    <div>
      <div class="label-caption">Package label (62×95 mm)</div>
      <div class="label">
        <div class="content">
          <img
            class="dm"
            src="https://barcode.tec-it.com/barcode.ashx?data=%2801%2920000000000013%2810%29A2305%2815%29281001%2821%29000457&code=DataMatrix&translate-esc=on"
            alt="DataMatrix PKG-00457"
          />

          <div class="info">
            <div class="name">Acetone, analytical grade</div>
            <div class="line">RNF-23-14 (Ivanov I.I.)</div>
            <div class="line">A2305 <span class="sep">/</span> 01.10.2028</div>
          </div>

          <div class="id-small">ID: PKG-00457</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
